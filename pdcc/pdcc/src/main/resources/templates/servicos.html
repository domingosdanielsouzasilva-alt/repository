<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>PDCC - Serviços</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<nav>
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuários</a>
    <a th:href="@{/clientes}">Clientes</a>
    <a th:href="@{/veiculos}">Veículos</a>
    <a th:href="@{/servicos}">Serviços</a>
    <a th:href="@{/garantias}">Garantias</a>
    <a th:href="@{/veiculos/qrcodes}">QR Codes</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Sair</button>
    </form>
</nav>

<main>

    <h1>Registro Técnico de Serviços</h1>

    <form th:action="@{/servicos}" th:object="${servico}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Veículo:</label><br>
        <select th:field="*{veiculo}" required>
            <option value="">Selecione um veículo</option>

            <option th:each="v : ${veiculos}"
                    th:value="${v.id}"
                    th:text="${v.modelo + ' - ' + v.placa}">
            </option>
        </select>

        <label>Data do Serviço:</label><br>
        <input type="date" th:field="*{dataServico}" required>

        <label>Diagnóstico:</label><br>
        <textarea th:field="*{diagnostico}" rows="4"></textarea>

        <label>Serviço Executado:</label><br>
        <textarea th:field="*{servicoExecutado}" rows="4"></textarea>

        <label>Peças Trocadas:</label><br>
        <input type="text" th:field="*{pecasTrocadas}">

        <label>Valor do Serviço (R$):</label><br>
        <input type="number"
               step="0.01"
               min="0"
               th:field="*{valorServico}">

        <label>Garantia até:</label><br>
        <input type="date" th:field="*{garantiaFim}">

        <br>
        <button type="submit">Salvar Serviço</button>

    </form>

    <h2>Serviços Registrados</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Veículo</th>
            <th>Placa</th>
            <th>Data</th>
            <th>Diagnóstico</th>
            <th>Serviço</th>
            <th>Peças</th>
            <th>Valor</th>
            <th>Garantia</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${servicos}">

            <td th:text="${s.id}"></td>

            <td th:text="${s.veiculo.modelo}"></td>

            <td th:text="${s.veiculo.placa}"></td>

            <td th:text="${s.dataServico}"></td>

            <td th:text="${s.diagnostico}"></td>

            <td th:text="${s.servicoExecutado}"></td>

            <td th:text="${s.pecasTrocadas}"></td>

            <td th:text="${s.valorServico != null ? 'R$ ' + #numbers.formatDecimal(s.valorServico, 1, 2) : 'R$ 0,00'}"></td>

            <td th:text="${s.garantiaFim}"></td>

            <td>
                <a th:href="@{'/servicos/excluir/' + ${s.id}}"
                   onclick="return confirm('Deseja excluir este serviço?')">
                    Excluir
                </a>
            </td>

        </tr>
        </tbody>

    </table>

</main>

</body>
</html>
