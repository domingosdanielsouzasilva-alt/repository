<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>PDCC - Garantias</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<nav>
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuários</a>
    <a th:href="@{/clientes}">Clientes</a>
    <a th:href="@{/veiculos}">Veículos</a>
    <a th:href="@{/servicos}">Serviços</a>
    <a th:href="@{/garantias}">Garantias</a>
    <a th:href="@{/veiculos/qrcodes}">QR Codes</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Sair</button>
    </form>
</nav>

<main>

    <h1>Controle de Garantias</h1>

    <table>
        <thead>
        <tr>
            <th>Cliente</th>
            <th>Veículo</th>
            <th>Placa</th>
            <th>Serviço</th>
            <th>Valor</th>
            <th>Data do Serviço</th>
            <th>Garantia até</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${servicos}">

            <td th:text="${s.veiculo.cliente.nome}"></td>

            <td th:text="${s.veiculo.modelo}"></td>

            <td th:text="${s.veiculo.placa}"></td>

            <td th:text="${s.servicoExecutado}"></td>

            <td th:text="${s.valorServico != null ? 'R$ ' + #numbers.formatDecimal(s.valorServico, 1, 2) : 'R$ 0,00'}"></td>

            <td th:text="${s.dataServico}"></td>

            <td th:text="${s.garantiaFim}"></td>

            <td>
                <span th:if="${s.garantiaFim == null}">
                    Sem garantia
                </span>

                <span th:if="${s.garantiaFim != null and s.garantiaFim.isAfter(hoje)}">
                    Ativa
                </span>

                <span th:if="${s.garantiaFim != null and s.garantiaFim.isBefore(hoje)}">
                    Vencida
                </span>

                <span th:if="${s.garantiaFim != null and s.garantiaFim.equals(hoje)}">
                    Vence hoje
                </span>
            </td>

        </tr>
        </tbody>
    </table>

</main>

</body>
</html>
